version: "3.8"

services:
  firefly_db:
    image: mariadb:lts
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_USER: firefly
      MYSQL_PASSWORD: firefly
      MYSQL_DATABASE: firefly
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  firefly_app:
    image: fireflyiii/core:6
    depends_on:
      firefly_db:
        condition: service_healthy
    environment:
      # AES-256 key: base64 of 32 zero-bytes — fine for ephemeral test containers
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: firefly_db
      DB_PORT: 3306
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: firefly
      APP_URL: "http://localhost:18080"
      TRUSTED_PROXIES: "**"
      LOG_CHANNEL: stderr
      MAIL_MAILER: log
      SEND_REGISTRATION_MAIL: "false"
      SEND_ERROR_MESSAGE: "false"
    ports:
      - "18080:8080"
    healthcheck:
      # curl exits 0 on any HTTP response; 401 = app is up and auth is working
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8080/api/v1/about"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
