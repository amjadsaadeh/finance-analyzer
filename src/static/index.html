<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Analyzer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --container-bg: #16213e;
    --user-msg: #0f3460;
    --assistant-msg: #1a1a40;
    --tool-msg: #2a2a4a;
    --input-bg: #0f3460;
    --input-border: #3a3a6e;
    --text: #e0e0e0;
    --text-muted: #8888aa;
    --error: #e74c3c;
    --warning-bg: #3d3500;
    --warning-border: #f0c040;
    --btn-confirm: #27ae60;
    --btn-cancel: #c0392b;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 1rem;
  }

  .chat-container {
    width: 100%;
    max-width: 800px;
    height: 100vh;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--container-bg);
    border-radius: 8px;
    overflow: hidden;
  }

  .chat-header {
    padding: 0.75rem 1rem;
    background: var(--input-bg);
    font-weight: 600;
    font-size: 1rem;
    border-bottom: 1px solid var(--input-border);
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .message {
    max-width: 80%;
    padding: 0.6rem 0.9rem;
    border-radius: 12px;
    word-wrap: break-word;
    white-space: pre-wrap;
    line-height: 1.5;
  }

  .message.user {
    align-self: flex-end;
    background: var(--user-msg);
    border-bottom-right-radius: 4px;
  }

  .message.assistant {
    align-self: flex-start;
    background: var(--assistant-msg);
    border-bottom-left-radius: 4px;
  }

  .message.tool-call {
    align-self: flex-start;
    background: var(--tool-msg);
    font-style: italic;
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 0.4rem 0.7rem;
    border-radius: 8px;
  }

  .message.error {
    align-self: flex-start;
    background: rgba(231, 76, 60, 0.2);
    color: var(--error);
    border: 1px solid var(--error);
    font-size: 0.9rem;
  }

  .approval-panel {
    display: none;
    background: var(--warning-bg);
    border: 2px solid var(--warning-border);
    border-radius: 8px;
    padding: 1rem;
    margin: 0.5rem 0;
  }

  .approval-panel.visible { display: block; }

  .approval-panel .preview-text {
    margin-bottom: 0.75rem;
    font-weight: 500;
  }

  .approval-panel .btn-group {
    display: flex;
    gap: 0.5rem;
  }

  .btn {
    padding: 0.5rem 1.25rem;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    color: white;
    transition: opacity 0.15s;
  }

  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-confirm { background: var(--btn-confirm); }
  .btn-cancel { background: var(--btn-cancel); }

  .chat-input {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    background: var(--input-bg);
    border-top: 1px solid var(--input-border);
  }

  .chat-input input {
    flex: 1;
    padding: 0.6rem 0.9rem;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    font-size: 0.95rem;
    outline: none;
  }

  .chat-input input:focus { border-color: #5a5aae; }

  .chat-input input:disabled { opacity: 0.5; }

  .chat-input button {
    padding: 0.6rem 1.25rem;
    background: #533483;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .chat-input button:hover { opacity: 0.85; }
  .chat-input button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">Finance Assistant</div>
  <div class="chat-messages" id="messages"></div>

  <div class="approval-panel" id="approval">
    <div class="preview-text" id="approval-preview"></div>
    <div class="btn-group">
      <button class="btn btn-confirm" id="btn-confirm" onclick="respondToApproval(true)">Confirm</button>
      <button class="btn btn-cancel" id="btn-cancel" onclick="respondToApproval(false)">Cancel</button>
    </div>
  </div>

  <div class="chat-input">
    <input type="text" id="message-input" placeholder="Ask about your finances..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const sessionId = crypto.randomUUID();
  let pendingStateId = null;
  let eventSource = null;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const approvalEl = document.getElementById('approval');
  const approvalPreview = document.getElementById('approval-preview');
  const btnConfirm = document.getElementById('btn-confirm');
  const btnCancel = document.getElementById('btn-cancel');

  function addMessage(text, className) {
    const div = document.createElement('div');
    div.className = 'message ' + className;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addAssistantMessage() {
    const div = document.createElement('div');
    div.className = 'message assistant';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function setLoading(loading) {
    inputEl.disabled = loading;
    sendBtn.disabled = loading;
    if (!loading) {
      inputEl.focus();
    }
  }

  function sendMessage() {
    const message = inputEl.value.trim();
    if (!message) return;

    inputEl.value = '';
    addMessage(message, 'user');
    setLoading(true);

    // Close any previous EventSource
    if (eventSource) {
      eventSource.close();
    }

    const assistantDiv = addAssistantMessage();
    let currentText = '';

    const url = '/chat/stream?session_id=' + encodeURIComponent(sessionId) + '&message=' + encodeURIComponent(message);
    eventSource = new EventSource(url);

    eventSource.addEventListener('text', function(e) {
      try {
        const data = JSON.parse(e.data);
        currentText += data.content || '';
        assistantDiv.textContent = currentText;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } catch (err) {
        // Ignore parse errors for text deltas
      }
    });

    eventSource.addEventListener('tool_call', function(e) {
      try {
        const data = JSON.parse(e.data);
        const toolName = data.name || 'unknown';
        addMessage('Using tool: ' + toolName, 'tool-call');
      } catch (err) {
        // Ignore parse errors
      }
    });

    eventSource.addEventListener('approval_needed', function(e) {
      try {
        const data = JSON.parse(e.data);
        const preview = data.preview;
        pendingStateId = data.state_id;

        // Show approval panel
        let previewText = '';
        if (preview && preview.previews) {
          preview.previews.forEach(function(p) {
            previewText += p.summary + '\n';
          });
        }
        approvalPreview.textContent = previewText.trim();
        approvalEl.classList.add('visible');

        btnConfirm.disabled = false;
        btnCancel.disabled = false;

        // Close the EventSource — we're waiting for user action
        eventSource.close();
        eventSource = null;
      } catch (err) {
        addMessage('Failed to parse approval request.', 'error');
      }
    });

    eventSource.addEventListener('done', function() {
      eventSource.close();
      eventSource = null;
      setLoading(false);
    });

    eventSource.addEventListener('error', function(e) {
      // SSE error event — could be natural end-of-stream or actual error
      if (eventSource && eventSource.readyState === EventSource.CLOSED) {
        // Stream ended normally
        return;
      }
      // Connection lost
      addMessage('Connection lost. Please try again.', 'error');
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      setLoading(false);
    });
  }

  function respondToApproval(approved) {
    if (!pendingStateId) return;

    btnConfirm.disabled = true;
    btnCancel.disabled = true;

    fetch('/chat/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        state_id: pendingStateId,
        approved: approved,
        session_id: sessionId
      })
    })
    .then(function(response) { return response.json(); })
    .then(function(data) {
      // Hide approval panel
      approvalEl.classList.remove('visible');
      pendingStateId = null;

      if (data.error) {
        addMessage(data.error, 'error');
      } else {
        // Display the agent's response
        const responseText = data.response || '(no response)';
        addMessage(responseText, 'assistant');
      }
      setLoading(false);
    })
    .catch(function() {
      addMessage('Something went wrong. Please try again.', 'error');
      approvalEl.classList.remove('visible');
      pendingStateId = null;
      setLoading(false);
    });
  }
</script>

</body>
</html>
