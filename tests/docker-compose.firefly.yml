services:
  firefly_db:
    image: mariadb:lts
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_USER: firefly
      MYSQL_PASSWORD: firefly
      MYSQL_DATABASE: firefly
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  firefly_app:
    image: fireflyiii/core:latest
    depends_on:
      firefly_db:
        condition: service_healthy
    environment:
      # AES-256 key: base64 of 32 zero-bytes — fine for ephemeral test containers
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: firefly_db
      DB_PORT: 3306
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: firefly
      APP_URL: "http://localhost:18080"
      TRUSTED_PROXIES: "**"
      LOG_CHANNEL: stderr
      MAIL_MAILER: log
      SEND_REGISTRATION_MAIL: "false"
      SEND_ERROR_MESSAGE: "false"
    volumes:
      # Override nginx http.conf to drop the IPv6 listen directive (unsupported in this env)
      - ./nginx-noipv6.conf:/etc/nginx/site-opts.d/http.conf:ro
    ports:
      - "18080:8080"
    healthcheck:
      # /healthcheck is a lightweight PHP-FPM probe built into the Firefly III image
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
